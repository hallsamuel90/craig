name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Socket API key
        run: |
          if [ -z "$SOCKET_SECURITY_API_KEY" ]; then
            echo "::error::SOCKET_SECURITY_API_KEY is unavailable. Add it as a Dependabot secret as well as an Actions secret."
            exit 1
          fi

      - name: Run Socket security scan
        run: pnpm security:socket
        env:
          SOCKET_CLI_GITHUB_TOKEN: ${{ github.token }}

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Build npm package
        run: pnpm build:npm

      - name: Audit npm package
        run: pnpm package:audit

      - name: Smoke npm package
        run: pnpm package:smoke
