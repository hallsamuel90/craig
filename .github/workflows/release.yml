name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    if: github.repository == 'hallsamuel90/craig' && github.ref == 'refs/heads/main'
    # Existing npm/GitHub publisher retains its original permissions and token.
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      binary_eligible: ${{ steps.binary-target.outputs.binary_eligible }}
      binary_tag: ${{ steps.binary-target.outputs.binary_tag }}
      binary_commit: ${{ steps.binary-target.outputs.binary_commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Socket security scan
        run: pnpm security:socket
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          SOCKET_CLI_GITHUB_TOKEN: ${{ github.token }}

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Build npm package
        run: pnpm build:npm

      - name: Audit npm package
        run: pnpm package:audit

      - name: Smoke npm package
        run: pnpm package:smoke

      - name: Check package publication
        id: package
        run: |
          name="$(node -p "require('./packages/cli/package.json').name")"
          version="$(node -p "require('./packages/cli/package.json').version")"

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.package.outputs.published != 'true'
        run: pnpm exec changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          version="${{ steps.package.outputs.version }}"
          tag="craig-cli@$version"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists."
            exit 0
          fi

          release_notes="$(awk -v version="$version" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/cli/CHANGELOG.md)"

          if [ -z "$(printf '%s' "$release_notes" | tr -d '[:space:]')" ]; then
            echo "No changelog entry found for craig-cli $version."
            exit 1
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "craig-cli $version" \
            --notes "$release_notes" \
            --latest

      - name: Select exact-source binary release target
        id: binary-target
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/binary/release-source.mjs --select

      - name: Apply Changesets version
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' -print -quit | grep -q .; then
            pnpm version-packages
          fi

      - name: Open version pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi

          unexpected_files="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(\.changeset/.*\.md|packages/cli/package\.json|packages/cli/CHANGELOG\.md)$' || true)"
          if [ -n "$unexpected_files" ]; then
            echo "Unexpected files changed by changeset version:"
            echo "$unexpected_files"
            exit 1
          fi

          git config user.name "craig-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c release/version-packages
          git add .
          git commit -m "Version packages"
          git push --force-with-lease origin HEAD:release/version-packages

          version_pr_number="$(gh pr list --head release/version-packages --state open --json number --jq '.[0].number // ""')"
          if [ -n "$version_pr_number" ]; then
            gh pr edit "$version_pr_number" \
              --title "Version packages" \
              --body "Automated Changesets version updates for the next craig-cli release."
          else
            gh pr create \
              --base main \
              --head release/version-packages \
              --title "Version packages" \
              --body "Automated Changesets version updates for the next craig-cli release."
            version_pr_number="$(gh pr list --head release/version-packages --state open --json number --jq '.[0].number // ""')"
          fi

          if [ -z "$version_pr_number" ]; then
            echo "Failed to find or create release/version-packages PR"
            exit 1
          fi

          gh pr merge "$version_pr_number" --auto --squash --delete-branch


  binary-build:
    name: binary-build
    needs: release
    if: >-
      github.repository == 'hallsamuel90/craig' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.CRAIG_BINARY_RELEASE_POLICY == 'unnotarized-preview' &&
      needs.release.result == 'success' && needs.release.outputs.binary_eligible == 'true'
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BINARY_RELEASE_TAG: ${{ needs.release.outputs.binary_tag }}
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      plan_sha: ${{ steps.seal.outputs.plan_sha }}
      attempt: ${{ steps.seal.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Eligibility and release-source verification bind this immutable run SHA to the tag.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: node scripts/binary/release-source.mjs --verify
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm build:npm
      - run: pnpm package:audit
      - run: pnpm package:smoke
      - run: pnpm binary:test
      - run: pnpm build:binary
      - run: pnpm binary:audit
      - run: pnpm binary:smoke
      - run: pnpm verify:artifact --executable .craig/binary-build/craig --profile soak --report dist/binary/terminal-soak.json
      - run: pnpm binary:release:prepare --policy unnotarized-preview
      - id: seal
        run: node scripts/binary/release-source.mjs --seal
      - uses: actions/upload-artifact@v4
        id: archive
        with:
          name: craig-macos-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/binary/*.tar.gz
            dist/binary/SHA256SUMS
            dist/binary/draft/release-assets.json
            dist/binary/draft/craig.rb
          if-no-files-found: error
          retention-days: 90

  binary-publish:
    name: binary-publish
    needs: [release, binary-build]
    if: >-
      github.repository == 'hallsamuel90/craig' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.CRAIG_BINARY_RELEASE_POLICY == 'unnotarized-preview' &&
      needs.release.result == 'success' && needs.binary-build.result == 'success' &&
      needs.release.outputs.binary_eligible == 'true'
    permissions:
      contents: write
      actions: read
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Eligibility and release-source verification bind this immutable run SHA to the tag.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.binary-build.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: dist/binary
      - name: Policy-authorized CI attachment and remote verification
        env:
          GH_TOKEN: ${{ github.token }}
          CRAIG_BINARY_RELEASE_POLICY: ${{ vars.CRAIG_BINARY_RELEASE_POLICY }}
          BINARY_BUILD_ATTEMPT: ${{ needs.binary-build.outputs.attempt }}
          BINARY_ARTIFACT_ID: ${{ needs.binary-build.outputs.artifact_id }}
          BINARY_PLAN_SHA256: ${{ needs.binary-build.outputs.plan_sha }}
        run: node scripts/binary/attach-release.mjs --ci dist/binary/draft/release-assets.json
