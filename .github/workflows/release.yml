name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Socket security scan
        run: pnpm security:socket
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          SOCKET_CLI_GITHUB_TOKEN: ${{ github.token }}

      - name: Apply Changesets version
        run: pnpm version-packages

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Build npm package
        run: pnpm build:npm

      - name: Audit npm package
        run: pnpm package:audit

      - name: Smoke npm package
        run: pnpm package:smoke

      - name: Open version pull request
        id: version_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unexpected_files="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(\.changeset/.*\.md|packages/cli/package\.json|packages/cli/CHANGELOG\.md)$' || true)"
          if [ -n "$unexpected_files" ]; then
            echo "Unexpected files changed by changeset version:"
            echo "$unexpected_files"
            exit 1
          fi

          git config user.name "craig-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c release/version-packages
          git add .
          git commit -m "Version packages"
          git push --force-with-lease origin HEAD:release/version-packages

          if gh pr view release/version-packages --json number >/dev/null 2>&1; then
            gh pr edit release/version-packages \
              --title "Version packages" \
              --body "Automated Changesets version updates for the next craig-cli release."
          else
            gh pr create \
              --base main \
              --head release/version-packages \
              --title "Version packages" \
              --body "Automated Changesets version updates for the next craig-cli release."
          fi

          gh pr merge release/version-packages --auto --squash --delete-branch
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Publish package
        if: steps.version_pr.outputs.created != 'true'
        run: pnpm exec changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
